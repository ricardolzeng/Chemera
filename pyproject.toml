[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chemera"
version = "0.1.0"
description = "Independent-site review crawler helpers"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
chemera-reviews = "chemera.cli:main"

[tool.setuptools.packages.find]
include = ["chemera*"]
